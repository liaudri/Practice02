<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סדרן המכולת - משחק Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Bar: Score, progress, and stage navigation -->
    <header class="header-bar">
        <div class="stats-container">
            <span id="stage-counter">שלב 1 מתוך 6</span> |
            <span>ניקוד: <strong id="score-display">0</strong></span> |
            <span>ניסיונות: <strong id="attempts-count">0</strong></span>
        </div>
        <div class="stage-nav" id="stage-nav"></div>
    </header>

    <!-- Main game wrapper -->
    <main class="game-container">

        <!-- Control panel and instructions -->
        <section class="controls-panel">
            <h2 id="stage-title">טוען שלב...</h2>
            <p id="stage-instruction">הוראות השלב יופיעו כאן.</p>

            <div id="dynamic-controls" class="controls-list">
                <!-- Select dropdowns will load dynamically here -->
            </div>

            <div class="btn-group">
                <button class="btn-check" onclick="checkSolution()">בדוק פתרון ✔️</button>
                <button class="btn-reset" onclick="resetCurrentStage()">איפוס 🔄</button>
            </div>
        </section>

        <!-- Grocery shelf board -->
        <section class="board-wrapper">
            <div class="shelf-board" id="shelf-board">
                <!-- Products will load dynamically here -->
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
