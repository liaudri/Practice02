<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סדרן המכולת | סדנאות Flexbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Dashboard Header -->
    <header class="receipt-header">
        <div class="stats-group">
            <div class="stat-tag" id="stage-counter">שלב 1/6</div>
            <div class="stat-tag highlight">ניקוד: <span id="score-display">0</span></div>
            <div class="stat-tag">ניסיונות: <span id="attempts-count">0</span></div>
        </div>
        <nav class="level-selector" id="stage-nav"></nav>
    </header>

    <!-- Main Game Section -->
    <main class="market-workspace">

        <!-- Controls Section -->
        <section class="clipboard-panel">
            <div class="clipboard-clip"></div>
            
            <header class="panel-head">
                <h2 id="stage-title">טוען שלב...</h2>
                <p id="stage-instruction">הוראות השלב יופיעו כאן.</p>
            </header>

            <!-- CSS Terminal Editor -->
            <div class="terminal-editor">
                <div class="terminal-header">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                    <span class="filename">styles.css</span>
                </div>
                <div class="code-body">
                    <span class="selector">#pond {</span>
                    <div class="code-line fixed-rule">display: flex;</div>
                    <div id="dynamic-controls" class="dynamic-rules"></div>
                    <span class="selector">}</span>
                </div>
            </div>

            <!-- Action Controls -->
            <footer class="action-bar">
                <button class="btn btn-submit" onclick="checkSolution()">בדוק סידור</button>
                <button class="btn btn-reload" onclick="resetCurrentStage()">איפוס שלב</button>
                <button class="btn btn-reload" style="background-color: #f87171; color: #0c4a6e; flex: 0.8;" onclick="restartGame()">איפוס משחק</button>
            </footer>
        </section>

        <!-- Shelf Display Board -->
        <section class="board-container">
            <div class="shelf-frame">
                <div class="shelf-board" id="pond"></div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
